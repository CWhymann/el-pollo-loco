<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>El Pollo Loco</title>
        <link rel="icon" href="./assets/icons/Huhn.svg" />
        <link rel="stylesheet" href="css/style.css" />
        <script type="module" src="js/game.js" defer></script>
    </head>
    <body>
        <header class="game-header">
            <div class="salsa-container">
                <img
                    src="./assets/img/6_salsa_bottle/bottle_rotation/2_bottle_rotation.png"
                    class="salza-bottle-icon"
                    alt="Salsa-Bottle"
                />
                <img
                    src="assets/icons/blood-drop.png"
                    class="blood-icon bottle-drop"
                />
            </div>

            <h1 id="game-title">
                E<span class="drip"
                    >l<img src="assets/icons/blood-drop.png" class="blood-icon"
                /></span>
                Po<span class="drip"
                    >l<img src="assets/icons/blood-drop.png" class="blood-icon"
                /></span>
                <span class="drip"
                    >l<img
                        src="assets/icons/blood-drop.png"
                        class="blood-icon" /></span
                >o
                <span class="drip"
                    >L<img
                        src="assets/icons/blood-drop.png"
                        class="blood-icon" /></span
                >oco
            </h1>
        </header>

        <div id="game-container">
            <canvas id="canvas"></canvas>
            <img
                src="assets/img/6_salsa_bottle/bottle_rotation/bottle_splash/3_bottle_splash.png"
                class="canvas-splash splash-1"
            />
            <img
                src="assets/img/6_salsa_bottle/bottle_rotation/bottle_splash/2_bottle_splash.png"
                class="canvas-splash splash-2"
            />
            <img
                src="assets/img/6_salsa_bottle/bottle_rotation/bottle_splash/4_bottle_splash.png"
                class="canvas-splash splash-3"
            />
            <div id="start-screen">
                <button id="start-button" class="splash-button splash-play">
                    Play
                </button>
                <button
                    id="controls-button"
                    class="splash-button splash-secondary"
                >
                    <span class="btn-text">Controls</span>
                </button>
                <button
                    id="imprint-button"
                    class="splash-button splash-secondary"
                >
                    <span class="btn-text">Index</span>
                </button>
            </div>
            <div id="ui-buttons">
                <button id="mute-button">🔊</button>
                <button id="fullscreen-button">⛶</button>
            </div>
            <div id="mobile-controls">
                <button id="btn-left">◀</button>
                <button id="btn-jump">▲</button>
                <button id="btn-right">▶</button>
                <button id="btn-throw">🍶</button>
            </div>

            <div id="rotate-screen">
                <p>🔄 Please rotate your device to play!</p>
            </div>
        </div>
    </body>
</html>
